<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel">Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- 1. Username/Password Login -->
        <form [formGroup]="loginForm" (ngSubmit)="loginWithCredentials()">
          <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input [formControl]="c.username" type="text" class="form-control" id="username">
            <div *ngIf="hasError(c.username, 'required')" class="text-danger">Email is required</div>
            <div *ngIf="hasError(c.username, 'email')" class="text-danger">Email is invalid</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input [formControl]="c.password" type="password" class="form-control" id="password">
            <div *ngIf="hasError(c.password,'required')" class="text-danger">Password is required</div>
            <div *ngIf="hasError(c.password,'minlength')" class="text-danger">Password must be longer than 5 characters</div>
          </div>
          <button [disabled]="loginForm.invalid" type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <hr class="my-3">

        <!-- 2. Certificate Login -->
        <button (click)="loginWithCertificate()" class="btn btn-secondary w-100 mb-2">
          Login mit Zertifikat
        </button>

        <!-- 3. OAuth2 Login -->
        <button (click)="loginWithOAuth2()" class="btn btn-success w-100">
          Login mit OAuth2
        </button>
      </div>
    </div>
  </div>
</div>
